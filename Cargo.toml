[package]
name = "endoscope"
version = "0.10.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.8"
# Версии зафиксированы под rustc 1.83: более новые zeroize/base64ct
# объявляют edition2024 и не разбираются этим Cargo.
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std", "fast", "zeroize"] }
getrandom = "=0.2.15"
zeroize = "=1.8.1"
base64ct = "=1.6.0"

# Windows-глаза: toolhelp32 (процессы), iphlpapi (сеть), PEB (командная строка).
# На Linux пакет не нужен — там /proc.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_Threading",
    "Win32_System_RestartManager",
    "Wdk_System_SystemInformation",
    "Wdk_System_Threading",
] }
ferrisetw = "1.2.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
